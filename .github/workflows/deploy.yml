name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]

# Least privilege: the job only needs to read the repository. Deployment uses the Cloudflare API token secret.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Mount the Station Readiness demo (elliyeen/kai-dart) under /dart.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elliyeen/kai-dart
          ref: main
          path: kai-dart

      - name: Build kai-dart for /dart and merge into out/dart
        working-directory: kai-dart
        env:
          EXPORT_TARGET: cloudflare-dart
          # Public (pk.) Mapbox token, inlined at build time. Restrict it to https://www.elliyeen.com/* in the Mapbox dashboard.
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
        run: |
          npm ci
          npm run build
          test -f out/index.html
          mkdir -p ../out/dart
          cp -R out/. ../out/dart/

      - name: Verify /dart mount
        run: |
          test -f out/dart/index.html
          test -f out/dart/demo.html
          ! grep -rq "kai-dart" out/dart

      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2042b1a264c1f211916daf921cd51c95
          command: pages deploy out --project-name elliyeen-get-started
