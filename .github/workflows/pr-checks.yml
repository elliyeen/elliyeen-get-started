# Checks that run on pull requests BEFORE merge. No secrets, no deploy, read-only token.
# The only other workflow (deploy.yml) runs on push to master, so until this file existed a PR had no checks.
name: PR checks
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Agent, collector security and rubric tests
        run: npx vitest run agents
